<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B3261E">
<meta name="version" content="0.18.2">
<title>Einsatz FF Velm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9ECEF;--surface:#FFFFFF;--ink:#15181C;--muted:#5B636D;--line:#C7CDD4;--red:#B3261E;--on-red:#FFFFFF;--soft:#F7E4E2;--ok:#1E7B3A;--ok-soft:#E1F1E5;--hdr:62px;color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121417;--surface:#1C2025;--ink:#E7E9EC;--muted:#9AA3AD;--line:#363D45;--red:#D9443A;--on-red:#FFFFFF;--soft:#3A2220;--ok:#4CB46A;--ok-soft:#1A2E21;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121417;--surface:#1C2025;--ink:#E7E9EC;--muted:#9AA3AD;--line:#363D45;--red:#D9443A;--on-red:#FFFFFF;--soft:#3A2220;--ok:#4CB46A;--ok-soft:#1A2E21;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.4 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
svg{flex:none}
[hidden]{display:none!important}

/* Kopfleiste */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line);height:var(--hdr)}
.bar{display:flex;align-items:center;gap:12px;padding:0 16px;height:100%}
.crest{width:40px;height:40px}
.brand{flex:1;min-width:0}
.brand b{display:block;font:700 26px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.01em}
.brand small{color:var(--muted);font-size:14px}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.conn i{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.conn.off i{background:var(--muted)}

/* Grundgerüst: Menü links, Inhalt rechts */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr)}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr));align-self:start;height:calc(100vh - var(--hdr) - env(safe-area-inset-top,0px));
  display:flex;flex-direction:column;gap:2px;padding:12px 10px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
.nav-i{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 12px;border:0;border-radius:8px;background:transparent;font-weight:600;cursor:pointer;text-align:left;position:relative;color:var(--muted)}
.nav-i svg{width:24px;height:24px}
.nav-i:hover{background:var(--bg);color:var(--ink)}
.nav-i[aria-current="page"]{background:var(--soft);color:var(--red)}
.nav-i[aria-current="page"]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:2px;background:var(--red)}
.nav-i.main{min-height:64px;font-size:19px;color:var(--ink)}
.nav-i.main[aria-current="page"]{color:var(--red)}
.nav-i.main svg{width:28px;height:28px}
.nav-i .lbl{flex:1;min-width:0;line-height:1.15}
.nav-i .lbl small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.badge{font:700 16px/1 "Barlow Condensed",sans-serif;padding:5px 8px;border-radius:5px}
.sep{height:1px;background:var(--line);margin:8px 6px}
.nav-i.final{color:var(--ink)}
.side-foot{margin-top:auto;padding:12px 12px 4px;color:var(--muted);font-size:13px}
.side-hint{padding:2px 12px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.nav-i .unread{min-width:24px;height:24px;border-radius:12px;background:var(--red);color:var(--on-red);font-size:13px;font-weight:700;display:inline-grid;place-items:center;padding:0 7px}
/* Chat */
.chat{gap:10px}
.msgs{list-style:none;margin:0;padding:12px;display:flex;flex-direction:column;gap:8px;height:min(55vh,520px);min-height:260px;overflow-y:auto;background:var(--bg);border-radius:8px}
.msg{max-width:80%;align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px 12px 12px 3px;padding:6px 12px 4px}
.msg.me{align-self:flex-end;background:var(--soft);border-color:transparent;border-radius:12px 12px 3px 12px}
.msg .who{font-size:13px;font-weight:700;color:var(--red)}
.msg time{display:block;text-align:right;font-size:12px;color:var(--muted)}
.msg.sys{align-self:center;background:none;border:0;color:var(--muted);font-size:14px;text-align:center;max-width:100%}
.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.quick button{white-space:nowrap;border:1.5px solid var(--line);background:var(--surface);border-radius:20px;padding:0 14px;min-height:42px;font-weight:600;font-size:15px;cursor:pointer}
.compose{display:flex;gap:8px}
.compose input{flex:1;min-width:0;min-height:52px;border:1.5px solid var(--line);border-radius:8px;padding:0 14px;font:inherit;font-weight:500;background:var(--surface);color:var(--ink)}
/* Gefahrstoffe: Warntafel */
.plate-wrap{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.plate{--o:#FF4E12;--k:#16181C;background:var(--k);padding:clamp(10px,2.2vw,18px);border-radius:4px;display:grid;grid-template-rows:1fr 1fr;gap:clamp(10px,2.2vw,18px);width:min(100%,460px);aspect-ratio:4/3}
.prow{position:relative;background:var(--o);display:flex;align-items:center;justify-content:center;font:700 clamp(64px,13vw,120px)/1 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--k);cursor:text}
.prow input{all:unset;width:100%;height:100%;text-align:center;font:inherit;color:inherit;caret-color:var(--k);letter-spacing:.06em}
.prow input::placeholder{color:rgba(22,24,28,.25)}
.prow:focus-within{box-shadow:inset 0 0 0 4px #FFFFFF}
.prow .xs{position:absolute;left:.18em;pointer-events:none}
.xbtn{min-width:64px;min-height:64px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 32px/1 "Barlow Condensed",sans-serif;cursor:pointer}
.xbtn[aria-pressed="true"]{background:#16181C;color:#FF4E12;border-color:#16181C}
.gside{display:grid;gap:8px}
#gOut{display:grid;gap:10px}
.gbox{border:1.5px solid var(--line);border-radius:8px;padding:12px 14px}
.gbox h3{margin:0 0 4px;font-size:14px;color:var(--muted)}
.gbox .big{font:700 26px/1.1 "Barlow Condensed",sans-serif;display:block;margin-bottom:2px}
.digits{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.digit{display:inline-flex;gap:8px;align-items:center;font-size:15px;background:var(--bg);border-radius:6px;padding:5px 10px}
.digit b{font:700 20px/1 "Barlow Condensed",sans-serif}
.gwarn{background:var(--red);color:var(--on-red);border-radius:8px;padding:12px 14px;font-weight:700}
.gnote{margin:8px 0 0;color:var(--red);font-weight:600}
.gsrc{margin:0;font-size:13px;color:var(--muted)}
/* Beteiligte Organisationseinheiten */
.oe-h{margin-top:10px}
.oe-wrap{overflow-x:auto}
.oe{width:100%;border-collapse:collapse;font-size:16px}
.oe th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:6px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.oe td{padding:10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.oe td:first-child{font-weight:600;white-space:normal}
.oe .nach{font-size:12px;font-weight:700;color:var(--muted);background:var(--bg);border-radius:4px;padding:2px 6px;margin-left:6px}
/* Gefährliche Stoffe: Reiter, Inhalte */
.gtabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.gtabs::-webkit-scrollbar{display:none}
.gtabs button{border:0;background:none;padding:0 14px;min-height:50px;font-weight:600;font-size:16px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;cursor:pointer}
.gtabs button[aria-selected="true"]{color:var(--red);border-bottom-color:var(--red)}
.gp{display:grid;gap:14px;align-content:start}
.gp h3{margin:0 0 4px;font:700 22px/1.1 "Barlow Condensed",sans-serif}
.gul{margin:0;padding-left:20px;display:grid;gap:3px}
.gams{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.gams>li{display:grid;grid-template-columns:52px 1fr;gap:12px;border:1.5px solid var(--line);border-radius:8px;padding:12px 14px 12px 8px}
.gams .L{font:700 48px/.9 "Barlow Condensed",sans-serif;color:var(--red);text-align:center}
.gzone{width:100%;max-width:640px;height:auto;color:var(--ink)}
.gzone text{font:600 15px "Barlow",sans-serif;fill:#16181C}
.gzone .lt{fill:currentColor}
.acc{border:1.5px solid var(--line);border-radius:8px;background:var(--surface)}
.acc>summary{min-height:54px;display:flex;align-items:center;gap:8px;padding:6px 14px;font-weight:700;font-size:17px;cursor:pointer;list-style:none}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"+";margin-left:auto;font:700 26px/1 "Barlow",sans-serif;color:var(--muted)}
.acc[open]>summary::after{content:"–"}
.acc>summary small{font-weight:500;font-size:14px;color:var(--muted)}
.acc .in{padding:0 14px 14px;display:grid;gap:12px}
.tw{overflow-x:auto}
.gt{width:100%;border-collapse:collapse;font-size:15px}
.gt th,.gt td{border-top:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.gt thead th{border-top:0;font-size:13px;color:var(--muted)}
.gt .n{font-variant-numeric:tabular-nums;white-space:nowrap}
.gt .hi{color:var(--red);font-weight:700}
.m4 td{text-align:center;font-size:20px;line-height:1}
.m4 td.y{color:var(--red)}
.m4 td.no{color:var(--line)}
.m4 tbody tr{cursor:pointer}
.m4 tbody th{font-weight:600;white-space:nowrap}
.m4 tbody tr[aria-pressed="true"]{background:var(--soft)}
.m4 tbody tr[aria-pressed="true"] th{color:var(--red)}
#g4Out{margin:0;font-weight:600}
.gsearch{font:inherit;font-weight:500;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:0 14px;min-height:52px;width:100%}
.slist{list-style:none;margin:0;padding:0;display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.slist button{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;min-height:56px;cursor:pointer}
.slist button[aria-current="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.slist b{display:block;font-weight:600}
.slist small{color:var(--muted);font-size:14px}
.sdet{border:2px solid var(--red);border-radius:10px;padding:14px 16px;display:grid;gap:12px;scroll-margin-top:calc(var(--hdr) + 12px)}
.sdet h2{font-size:32px}
.sdet .x{margin-left:auto}
.shd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.htag{display:inline-block;margin:0 6px 4px 0;font-size:13px;font-weight:700;padding:3px 9px;border-radius:4px;border:1.5px solid transparent}
.h-F{background:#C62828;color:#FFFFFF}
.h-T{background:#16181C;color:#FFFFFF;border-color:var(--line)}
.h-C{background:#5B636D;color:#FFFFFF}
.h-O{background:#F2C200;color:#16181C}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kv>div{background:var(--bg);border-radius:8px;padding:8px 10px}
.kv b{display:block;font:700 26px/1.1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.kv span{font-size:13px;color:var(--muted);font-weight:600}
.kv small{display:block;font-size:13px;color:var(--muted)}
.exb{display:grid;gap:4px}
.exbar{position:relative;height:16px;background:var(--bg);border-radius:4px;overflow:hidden}
.exbar i{position:absolute;top:0;bottom:0;background:var(--red)}
.exlab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.ck{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.ck>div{border:1.5px solid var(--line);border-radius:8px;padding:10px 12px}
.ghint{border-left:4px solid var(--red);padding:2px 0 2px 12px;margin:0;font-weight:600}
.dias{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px 12px}
.dias li{display:flex;gap:16px;align-items:center;min-height:64px}
.dia{width:44px;height:44px;margin:0 6px;transform:rotate(45deg);border:2px solid #16181C;outline:1.5px solid var(--line);flex:none;display:grid;place-items:center}
.dia span{transform:rotate(-45deg);font:700 17px/1 "Barlow Condensed",sans-serif;background:rgba(255,255,255,.85);color:#16181C;border-radius:3px;padding:1px 3px}
.dias b{display:block;font:700 20px/1 "Barlow Condensed",sans-serif}
.dias small{font-size:14px;color:var(--muted);line-height:1.25;display:block}
.sw{display:inline-block;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);vertical-align:-4px;margin-right:6px}
.sw2{display:inline-grid;grid-template-columns:1fr 1fr;width:20px;height:20px;border-radius:50%;overflow:hidden;border:1.5px solid var(--line);vertical-align:-4px;margin-right:6px}
.calc{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.calc input{font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:0 10px;min-height:48px;width:110px}
.calc output{font:700 24px/1 "Barlow Condensed",sans-serif}
.gtel{font-weight:700;white-space:nowrap}
.gp .muted+.muted{margin-top:-6px}
.calc select{font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:0 8px;min-height:48px}
.nav-i.more{min-height:44px;font-size:15px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.nav-i.add{min-height:46px;margin:2px 0;border:1.5px dashed var(--line);color:var(--muted)}
.nav-i.add .plus{font:700 22px/1 "Barlow",sans-serif;color:var(--red)}

main{padding:16px;display:grid;gap:16px;align-content:start;max-width:1100px;width:100%}

@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .side{flex-direction:row;height:auto;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);padding:6px 8px;z-index:5;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .nav-i,.nav-i.main{min-height:48px;font-size:16px;white-space:nowrap;padding:0 12px}
  .nav-i .lbl small,.sep,.side-foot,.side-hint{display:none}
  .nav-i[aria-current="page"]::before{left:10px;right:10px;top:auto;bottom:2px;width:auto;height:3px}
}

/* Alarm-Bühne */
.stage{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.alarm{--c:#E5533B;--i:#FFFFFF;background:var(--c);color:var(--i);padding:18px 20px 20px;display:grid;gap:14px}
.alarm-head{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;flex-wrap:wrap}
.alarm-head .when{font:700 22px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.alarm-head .when small{font:inherit;opacity:.8;margin-right:6px}
.alarm-head .since{margin-left:auto;display:flex;align-items:baseline;gap:6px}
.siren{width:12px;height:12px;border-radius:50%;background:currentColor;animation:pulse 1s steps(2,jump-none) infinite}
@keyframes pulse{50%{opacity:.25}}
.alarm-head .t{margin-left:auto;font:700 22px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.alarm-main{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:center}
.code{font:700 clamp(84px,14vw,132px)/.82 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:-.02em;grid-row:span 2}
.what{font:700 clamp(26px,3.6vw,36px)/1.05 "Barlow Condensed",sans-serif}
.where{font-size:19px;font-weight:600}
.where small{display:block;font-weight:500;opacity:.85;font-size:16px}
.alarm-text{background:rgba(0,0,0,.14);border-radius:8px;padding:10px 12px;font-size:16px}
.alarm-text b{display:block;font-size:13px;opacity:.85;margin-bottom:2px}

.respond{padding:16px 20px 20px;display:grid;gap:14px}
h2{margin:0;font:700 24px/1.1 "Barlow Condensed",sans-serif}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cnt{border-radius:8px;padding:10px 12px;background:var(--bg)}
.cnt b{display:block;font:700 44px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.cnt span{font-size:15px;font-weight:600}
.cnt.yes{background:var(--ok-soft);color:var(--ok)}
.cnt.no{background:var(--soft);color:var(--red)}
.cnt.open{color:var(--muted)}
.quals{display:flex;flex-wrap:wrap;gap:8px}
.q{padding:6px 12px;border-radius:20px;border:1.5px solid var(--line);font-weight:600;font-size:15px}
.q b{font-size:18px;margin-right:5px}
.q.zero{border-color:var(--red);color:var(--red)}
button.q{background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:15px;cursor:pointer;min-height:40px}
button.q.zero{color:var(--red)}
button.q[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.plist .tg.hit{background:var(--ink);color:var(--surface)}
.people{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:620px){.people{grid-template-columns:3fr 2fr}}
.sub{margin:0 0 4px;font-size:15px;color:var(--muted)}
#noBox{border:1.5px solid var(--red);border-radius:8px;padding:8px 12px}
#yesBox{border:1.5px solid var(--ok);border-radius:8px;padding:8px 12px}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;gap:8px;padding:8px 4px;border-top:1px solid var(--line)}
.plist li:first-child{border-top:0}
.plist .n{font-weight:600;flex:1;min-width:0}
.plist .tg{font-size:12px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--bg);color:var(--muted)}
.plist time{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.plist li.new{animation:in 1.2s ease-out}
@keyframes in{from{background:var(--ok-soft)}}
.empty{color:var(--muted);font-size:15px}
@media (prefers-reduced-motion:reduce){.siren,.plist li.new{animation:none}}

.btn{min-height:48px;padding:0 18px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn svg{width:20px;height:20px}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* 3D-Ansicht Einsatzort */
.m3d-wrap{position:relative;height:min(60vh,540px);min-height:300px;margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.m3d{position:absolute;inset:0}
.m3d gmp-map-3d{display:block;width:100%;height:100%}
.m3d-msg{position:absolute;inset:0;display:grid;place-items:center;margin:0;padding:20px;text-align:center;color:var(--muted);max-width:none}
.m3d-spin{position:absolute;top:10px;right:10px;z-index:2}

/* Ruhezustand */
.quiet{padding:22px 20px;display:grid;gap:16px}
.quiet-head{display:flex;align-items:center;gap:14px}
.quiet-head svg{width:44px;height:44px;color:var(--ok)}
.quiet-head b{display:block;font:700 30px/1 "Barlow Condensed",sans-serif}
.quiet-head span{color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:12px}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0;padding-top:0}
.as{font:700 22px/1 "Barlow Condensed",sans-serif;text-align:center;padding:8px 0;border-radius:6px}
.list b{display:block;font-weight:600}
.list span{color:var(--muted);font-size:15px}
.list time{color:var(--muted);font-size:14px;text-align:right}

/* Unterseiten */
.page-head{display:flex;align-items:center;gap:14px}
.page-head svg{width:40px;height:40px;color:var(--red)}
.page-head h1{margin:0;font:700 34px/1 "Barlow Condensed",sans-serif}
.tag{font-size:13px;font-weight:700;padding:3px 8px;border-radius:4px;background:var(--bg);color:var(--muted)}
.lead{margin:0;max-width:60ch}
.dest{display:grid;gap:4px;border-left:4px solid var(--red);padding:4px 0 4px 14px}
.dest b{font:700 28px/1.1 "Barlow Condensed",sans-serif}
.dest span{color:var(--muted)}
.muted{color:var(--muted);margin:0}

/* Atemschutzüberwachung */
.ats{display:grid;gap:16px}
.ats .page-head{flex-wrap:wrap}
.ats .page-head h1{flex:1}
.ats-meta{display:grid;grid-template-columns:170px 1fr 220px;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
.fld input,.fld textarea,.ats-in{font:inherit;font-weight:500;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:0 10px;min-height:44px;width:100%;min-width:0}
.fld textarea{padding:8px 10px;min-height:60px;resize:vertical}
.ats-set summary{cursor:pointer;font-weight:600}
.ats-setg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}
.ats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px}
.ats-tr{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:12px;align-content:start}
.ats-tr.warn{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.ats-th{display:flex;align-items:center;gap:8px}
.ats-th h2{flex:1}
.ats-x{min-width:44px;min-height:44px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;border-radius:8px}
.ats-stat{background:var(--bg);border-radius:8px;padding:12px 14px}
.ats-pl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:8px}
.ats-p{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;background:var(--bg);border-radius:8px;padding:8px 10px}
.ats-pf{display:grid;gap:6px;min-width:0}
.ats-pf .fld{font-size:12px}
.ats-pf .fld input{min-height:40px;padding:0 8px}
.btn.ats-addp{justify-self:start;border-style:dashed}
.ats-bot{width:64px;height:auto;display:block}
.ats-bot.leer{animation:pulse 1s steps(2,jump-none) infinite}
.ats-bot.leer .sh{fill:var(--red);stroke:var(--red)}
.ats-bot.leer .st{fill:var(--red)}
.ats-bot .sh{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.ats-bot .st{fill:var(--muted)}
.ats-bot .gl{fill:#FFFFFF;opacity:.3}
.ats-bot .fl{transform-box:fill-box;transform-origin:50% 100%;transition:transform 1s linear,fill .4s}
.ats-bot .fl.bl{animation:pulse 1s steps(2,jump-none) infinite}
.ats-rest{font:700 44px/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
.ats-st{font-weight:700;margin-top:2px}
.ats-sub{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.ats-kb{display:inline-block;margin-top:6px;background:#E8B400;color:#15181C;border-radius:6px;padding:3px 8px;font-weight:700;font-size:14px}
.ats-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ats-btns .btn{justify-content:center}
.btn.ats-go{background:var(--ok);border-color:var(--ok);color:#FFFFFF}
.btn:disabled{opacity:.45;cursor:default}
.ats-n{position:relative}
.ats-n span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;font-size:14px}
.ats-n input{padding-left:28px}
.ats-chk{display:grid;gap:8px}
.ats-chk label{display:flex;align-items:center;gap:10px;font-weight:600}
.ats-chk input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--ok)}
.ats-r3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ats-r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:760px){.ats-meta{grid-template-columns:1fr}.ats-setg{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){.ats-bot .fl{transition:none}}

.demo{border:1.5px dashed var(--line);border-radius:10px;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:var(--muted);font-size:15px}
.demo span{flex:1;min-width:200px}
.demo-btns{display:flex;flex-wrap:wrap;gap:8px}
.demo-addr{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px}
.demo-addr input{flex:2 1 240px;min-width:0;min-height:48px;border:1.5px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;font-weight:500;background:var(--surface);color:var(--ink)}
.demo-addr input#dCity{flex:1 1 160px}
.foot-m{display:none;color:var(--muted);font-size:14px;padding:0 4px}
@media (max-width:760px){.foot-m{display:block}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <svg class="crest" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2 36 8v12c0 9-7 15-16 18C11 35 4 29 4 20V8z" fill="var(--red)"/><path d="M20 10c4 5 6 8 6 12a6 6 0 0 1-12 0c0-2 1-4 2-5 0 2 1 3 2 3 0-4 1-7 2-10z" fill="var(--on-red)"/></svg>
    <div class="brand"><b>FF Velm</b><small>Einsatz-App <span class="ver"></span></small></div>
    <span class="conn" id="conn"><i></i><span>Online</span></span>
  </div>
</header>

<div class="shell">
  <nav class="side" id="side" aria-label="Menü"></nav>
  <main id="main"></main>
</div>

<!-- Vorlagen -->
<template id="tpl-alarmierung">
  <section class="stage" aria-live="assertive">
    <div id="alarmView" hidden>
      <div class="alarm" id="alarmBox">
        <div class="alarm-head"><span class="siren" aria-hidden="true"></span><span class="when"><small>Alarmiert</small><span id="aWhen"></span></span><span class="since">seit <span class="t" id="since" aria-label="Zeit seit Alarmierung">00:00</span></span></div>
        <div class="alarm-main">
          <div class="code" id="aCode"></div>
          <div class="what" id="aWhat"></div>
          <div class="where" id="aWhere"></div>
        </div>
        <div class="alarm-text"><b>Alarmtext</b><span id="aText"></span></div>
      </div>
      <div class="respond">
        <h2>Rückmeldungen der Mannschaft</h2>
        <div class="counts" aria-live="polite">
          <div class="cnt yes"><b id="cYes">0</b><span>Angenommen</span></div>
          <div class="cnt no"><b id="cNo">0</b><span>Abgelehnt</span></div>
          <div class="cnt open"><b id="cOpen">0</b><span>Keine Antwort</span></div>
        </div>
        <div class="quals" id="quals" role="group" aria-label="Nach Qualifikation filtern"></div>
        <div id="yesBox"><h3 class="sub">Angenommen</h3><ul class="plist" id="lYes"></ul></div>
        <div id="noBox"><h3 class="sub">Abgelehnt</h3><ul class="plist" id="lNo"></ul></div>
        <h2 class="oe-h">Beteiligte Organisationseinheiten</h2>
        <div class="oe-wrap"><table class="oe"><thead><tr><th>Organisationseinheit</th><th>Datum</th><th>Alarmierungszeit</th></tr></thead><tbody id="oeBody"></tbody></table></div>
      </div>
    </div>
    <div class="quiet" id="quietView">
      <div class="quiet-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m7.5 12.5 3 3 6-6.5"/></svg>
        <div><b>Keine Alarmierung</b><span>Bei einem Alarm erscheinen hier Einsatzdaten und Rückmeldungen der Mannschaft.</span></div>
      </div>
    </div>
  </section>
  <div class="demo">
    <span>Vorschau: Alarmierungen und Rückmeldungen sind Beispieldaten.</span>
    <div class="demo-addr" id="demoAddr"><input id="dStreet" placeholder="Adresse für Probealarm: Straße und Hausnummer" autocomplete="off" aria-label="Straße und Hausnummer für den Probealarm"><input id="dCity" placeholder="PLZ und Ort" autocomplete="off" aria-label="PLZ und Ort für den Probealarm"></div>
    <div class="demo-btns" id="demoBtns"><button class="btn" data-demo="0">Probealarm Hausbrand</button><button class="btn" data-demo="1">Probealarm Verkehrsunfall</button><button class="btn" data-demo="2">Probealarm Industrie (Großeinsatz)</button></div>
    <button class="btn primary" id="demoAlarm" hidden>Einsatz beenden</button>
  </div>
</template>

<template id="tpl-navigation">
  <section class="card">
    <div class="page-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><h1>Navigation</h1></div>
    <div id="navOn" hidden>
      <div class="dest"><b id="nAddr"></b><span id="nCity"></span></div>
      <div class="actions" style="margin-top:14px"><a class="btn primary" id="nGo" target="_blank" rel="noopener">Route in Google Maps öffnen</a><a class="btn" id="nEarth" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>3D-Ansicht in Google Earth</a></div>
      <div class="m3d-wrap">
        <div class="m3d" id="m3d"></div>
        <p class="m3d-msg" id="m3dMsg"></p>
        <button class="btn m3d-spin" id="m3dSpin" aria-pressed="true" hidden>Drehung anhalten</button>
      </div>
    </div>
    <p class="muted" id="navOff">Keine aktive Alarmierung. Bei einem Alarm wird der Einsatzort hier automatisch als Ziel übernommen.</p>
  </section>
</template>

<template id="tpl-chat">
  <section class="card chat">
    <div class="page-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg><h1>Chat</h1><span class="tag" id="chName"></span></div>
    <p class="muted" id="chMembers"></p>
    <ul class="msgs" id="msgs" aria-live="polite"></ul>
    <div class="quick" id="quick" aria-label="Schnellnachrichten"></div>
    <div class="compose"><input id="chIn" type="text" placeholder="Nachricht an alle Feuerwehren" autocomplete="off" enterkeyhint="send" aria-label="Nachricht"><button class="btn primary" id="chSend">Senden</button></div>
  </section>
</template>

<template id="tpl-gefahr">
  <section class="card">
    <div class="page-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 21h20z"/><path d="M12 10v5M12 18v.01"/></svg><h1>Gefährliche Stoffe</h1></div>
    <div class="gtabs" role="tablist" aria-label="Bereiche">
      <button role="tab" data-gt="tafel">Warntafel</button>
      <button role="tab" data-gt="sofort">Sofortmaßnahmen</button>
      <button role="tab" data-gt="stoffe">Stoffe</button>
      <button role="tab" data-gt="kennz">Kennzeichnung</button>
      <button role="tab" data-gt="lagen">Sonderlagen</button>
    </div>

    <div class="gp" data-gp="sofort" role="tabpanel">
      <div class="gwarn">Menschenrettung hat höchste Priorität. Solange Information fehlt, größte Gefahr annehmen!</div>
      <p class="muted">Sofortmaßnahmen nach GAMS, möglichst gleichzeitig durchführen.</p>
      <ol class="gams">
        <li><span class="L">G</span><div><h3>Gefahr erkennen, Erkundung</h3><ul class="gul">
          <li>Eigene Wahrnehmungen: Rauch, Flammen, Gasschwaden</li>
          <li>Kennzeichnung von Behältern und Verpackungen, Gefahrzettel</li>
          <li>Warntafel (Reiter „Warntafel“)</li>
          <li>Beförderungspapiere, Frachtbrief, Unfallmerkblätter, Sicherheitsdatenblätter</li>
          <li>4A-C-4E-Regel (unten)</li></ul></div></li>
        <li><span class="L">A</span><div><h3>Absperren, Absichern</h3><ul class="gul">
          <li>Mindestens <b>30 bis 60 m</b> von der Unfallstelle</li>
          <li>Mehrere 100 m bis <b>1000 m</b> bei Tankbrand, Explosivstoffen und Gasen in Großbehältern</li>
          <li>Windrichtung und Gefälle beachten</li>
          <li>Dreifachen Brandschutz aufbauen</li></ul></div></li>
        <li><span class="L">M</span><div><h3>Menschenrettung</h3><ul class="gul">
          <li>Sofort durch die ersteintreffende Feuerwehr, jede Sekunde zählt</li>
          <li>Ausreichend: Brandschutzbekleidung, Brandschutzhaube, umluftunabhängiger Atemschutz, (Chemikalien-)Schutzhandschuhe, Sicherheitsstiefel</li>
          <li>Mit dem Wind annähern, Kontakt mit dem Stoff vermeiden</li>
          <li>Nur unbedingt nötiges Personal, Aufenthalt so kurz wie möglich</li></ul></div></li>
        <li><span class="L">S</span><div><h3>Spezialkräfte anfordern</h3><ul class="gul">
          <li>Schadstoff-, Strahlenschutz- oder Deko-Stützpunkt, Fachberater, Behörde</li></ul></div></li>
      </ol>

      <details class="acc" open><summary>Absperrbereiche</summary><div class="in">
        <svg class="gzone" viewBox="0 0 640 300" role="img" aria-label="Skizze der Absperrbereiche: Wirkzone innen, Sicherheitszone 30 bis 60 m, Deko-Platz an der inneren Absperrgrenze auf der Windseite, Bereitstellungsraum außerhalb">
          <ellipse cx="350" cy="160" rx="285" ry="132" fill="#1E7B3A" fill-opacity=".35"/>
          <ellipse cx="370" cy="150" rx="205" ry="92" fill="#F2C200" fill-opacity=".85"/>
          <ellipse cx="395" cy="145" rx="95" ry="42" fill="#E5533B"/>
          <text x="395" y="150" text-anchor="middle" fill="#FFFFFF" style="fill:#FFFFFF">Wirkzone</text>
          <text x="370" y="225" text-anchor="middle">Sicherheitszone (mind. 30–60 m)</text>
          <line x1="490" y1="145" x2="575" y2="145" stroke="#16181C" stroke-width="2" marker-end="url(#ga)" marker-start="url(#ga)"/>
          <defs><marker id="ga" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16181C"/></marker></defs>
          <text x="532" y="135" text-anchor="middle">30–60 m</text>
          <rect x="128" y="168" width="96" height="40" rx="6" fill="#FFFFFF" stroke="#16181C" stroke-width="1.5"/>
          <text x="176" y="193" text-anchor="middle">Deko-Platz</text>
          <text x="350" y="282" text-anchor="middle" class="lt">Bereitstellungsraum (außerhalb der Gefahrenzone)</text>
          <path d="M20 60h62" stroke="currentColor" stroke-width="5"/><path d="M80 48l18 12-18 12z" fill="currentColor"/>
          <text x="20" y="44" class="lt">Wind</text>
        </svg>
        <ul class="gul">
          <li>Gefahrenzone = Wirkzone + Sicherheitszone; ihre Grenze ist die innere Absperrgrenze.</li>
          <li>Deko-Platz an der inneren Absperrgrenze auf der windzugekehrten Seite, auf befestigtem Untergrund. Die Gefahrenzone wird nur über den Deko-Platz verlassen.</li>
          <li>Bereitstellungsraum außerhalb, die äußere Absperrung übernimmt die Polizei.</li>
        </ul>
        <p class="ghint">3A-Regel: Abstand so groß, Aufenthaltszeit so kurz, Abschirmung so gut wie möglich.</p>
      </div></details>

      <details class="acc"><summary>4A-C-4E-Regel <small>Gefahren durch … für …</small></summary><div class="in">
        <p class="muted">Zutreffende Gefahren antippen. Darunter steht, wen sie betreffen.</p>
        <div class="tw"><table class="gt m4" id="g4"></table></div>
        <p id="g4Out" aria-live="polite"></p>
      </div></details>
    </div>

    <div class="gp" data-gp="tafel" role="tabpanel">
      <div class="plate-wrap">
        <div class="plate" role="group" aria-label="Warntafel">
          <label class="prow"><span class="xs" id="gXs" hidden>X</span><input id="gK" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="00" autocomplete="off" enterkeyhint="next" aria-label="Gefahrnummer, obere Zahl"></label>
          <label class="prow"><input id="gUN" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" autocomplete="off" enterkeyhint="done" aria-label="UN-Nummer, untere Zahl"></label>
        </div>
        <div class="gside">
          <button class="xbtn" id="gX" aria-pressed="false" title="X vor der Gefahrnummer: reagiert gefährlich mit Wasser">X</button>
          <button class="btn" id="gClr">Leeren</button>
        </div>
      </div>
      <p class="muted">Oben die Gefahrnummer, unten die UN-Nummer eintippen. „X“ antippen, wenn es auf der Tafel vor der Gefahrnummer steht.</p>
      <div id="gOut" aria-live="polite"></div>
      <details class="acc"><summary>Alle Gefahrnummern</summary><div class="in"><div class="tw"><table class="gt" id="gAll"></table></div>
        <p class="muted">*) Wasser nur im Einverständnis mit Sachverständigen einsetzen.</p></div></details>
    </div>

    <div class="gp" data-gp="stoffe" role="tabpanel">
      <input class="gsearch" id="gQ" type="search" placeholder="Stoffname oder UN-Nummer" autocomplete="off" enterkeyhint="search" aria-label="Stoff suchen">
      <div id="gDet"></div>
      <ul class="slist" id="gList"></ul>
      <details class="acc"><summary>Grenzwerte, Begriffe</summary><div class="in"><ul class="gul">
        <li><b>MAK</b> (maximale Arbeitsplatzkonzentration): höchstzulässige Konzentration in der Luft am Arbeitsplatz bei in der Regel 8 Stunden täglich und 40 Stunden pro Woche.</li>
        <li><b>TRK</b> (technische Richtkonzentration): für Stoffe ohne unbedenkliche Konzentration, etwa krebserregende. Senkt das Risiko, schließt es aber nicht aus. In der Stoffliste rot markiert.</li>
        <li><b>IDLH</b>: Konzentration, unter der bei bis zu 30 Minuten Einwirkung keine bleibenden Schäden oder Lebensgefahr zu erwarten sind.</li>
        <li><b>AEGL-1</b>: darüber vorübergehende, umkehrbare Reizungen. <b>AEGL-2</b>: darüber bleibende oder schwere Schäden, Flucht kann beeinträchtigt sein. <b>AEGL-3</b>: darüber lebensbedrohlich oder tödlich. Werte für 10 min, 30 min, 60 min, 4 h und 8 h.</li>
        <li><b>ETW</b> (Einsatztoleranzwert): über diesem Wert grundsätzlich unter Atemschutz arbeiten. ETW-4 entspricht AEGL-2 für 4 Stunden.</li>
      </ul></div></details>
    </div>

    <div class="gp" data-gp="kennz" role="tabpanel">
      <h3>Klassen beim Gefahrguttransport</h3>
      <p class="muted">Gefahrzettel sind auf der Spitze stehende Quadrate. Farbe und Symbol zeigen die Gefahr, die Ziffer unten die Klasse. Oft steht zusätzlich die UN-Nummer oder ein Text wie „FLAMMABLE LIQUID“ darauf.</p>
      <ul class="dias" id="gKl"></ul>
      <details class="acc"><summary>Klasse 1: Unterklassen</summary><div class="in"><div class="tw"><table class="gt">
        <tr><th class="n">1.1</th><td>Massenexplosionsfähig: die Explosion erfasst nahezu die ganze Ladung gleichzeitig.</td></tr>
        <tr><th class="n">1.2</th><td>Gefahr durch Splitter, Spreng- und Wurfstücke, nicht massenexplosionsfähig.</td></tr>
        <tr><th class="n">1.3</th><td>Feuergefahr mit geringer Druck- oder Splitterwirkung, starke Strahlungswärme möglich.</td></tr>
        <tr><th class="n">1.4</th><td>Geringe Explosionsgefahr, Wirkung bleibt im Wesentlichen auf das Versandstück beschränkt.</td></tr>
        <tr><th class="n">1.5</th><td>Sehr unempfindlich, aber massenexplosionsfähig.</td></tr>
        <tr><th class="n">1.6</th><td>Extrem unempfindlich, Gefahr auf einen einzelnen Gegenstand beschränkt.</td></tr>
      </table></div><p class="muted">Zettel 1.1 bis 1.3 zeigen die explodierende Bombe, 1.4 bis 1.6 nur die Ziffer. Dazu kommt ein Buchstabe für die Verträglichkeitsgruppe, z. B. „1.1 D“.</p></div></details>
      <details class="acc"><summary>Farbkennzeichnung von Gasflaschen</summary><div class="in">
        <p class="muted">Maßgeblich ist nur die Farbe der Flaschenschulter. Gilt nicht für Feuerlöscher und Flüssiggasflaschen (Propan/Butan).</p>
        <div class="tw"><table class="gt">
          <tr><td><span class="sw" style="background:#F2C200"></span>Gelb</td><td>giftig und/oder ätzend</td></tr>
          <tr><td><span class="sw" style="background:#C62828"></span>Rot</td><td>brennbar</td></tr>
          <tr><td><span class="sw" style="background:#7FB8E6"></span>Hellblau</td><td>oxidierend</td></tr>
          <tr><td><span class="sw" style="background:#3DBE4A"></span>Leuchtgrün</td><td>inert (ungiftig, nicht ätzend, nicht brennbar, nicht oxidierend)</td></tr>
          <tr><td><span class="sw" style="background:#6B2E1E"></span>Kastanienbraun</td><td>Acetylen</td></tr>
          <tr><td><span class="sw" style="background:#FFFFFF"></span>Weiß</td><td>Sauerstoff</td></tr>
          <tr><td><span class="sw" style="background:#1F4E9C"></span>Blau</td><td>Lachgas</td></tr>
          <tr><td><span class="sw" style="background:#16181C"></span>Schwarz</td><td>Stickstoff</td></tr>
          <tr><td><span class="sw" style="background:#8A8F96"></span>Grau</td><td>Kohlendioxid</td></tr>
          <tr><td><span class="sw" style="background:#7A5230"></span>Braun</td><td>Helium</td></tr>
          <tr><td><span class="sw" style="background:#1E6B3A"></span>Dunkelgrün</td><td>Argon</td></tr>
          <tr><td><span class="sw" style="background:#2AA6A6"></span>Türkisblau</td><td>Stickstoff mit Stickstoffmonoxid</td></tr>
          <tr><td><span class="sw2"><i style="background:#F2C200"></i><i style="background:#C62828"></i></span>Gelb und Rot</td><td>giftig/ätzend und brennbar</td></tr>
          <tr><td><span class="sw2"><i style="background:#F2C200"></i><i style="background:#7FB8E6"></i></span>Gelb und Hellblau</td><td>giftig/ätzend und oxidierend</td></tr>
          <tr><td><span class="sw2"><i style="background:#FFFFFF"></i><i style="background:#16181C"></i></span>Weiß und Schwarz</td><td>Druckluft, Atemluft</td></tr>
        </table></div>
        <p class="muted">Medizinische Gase: Flaschenkörper weiß. Altbestände: weiß = Acetylen, grün = Stickstoff, grau = sonstige nicht brennbare Gase.</p>
      </div></details>
      <details class="acc"><summary>GHS-Piktogramme und Arbeitsschutz</summary><div class="in"><ul class="gul">
        <li>Verpackungen von Chemikalien tragen GHS-Piktogramme (rote Raute, schwarzes Symbol) mit dem Signalwort „Gefahr“ oder „Achtung“ sowie H-Sätzen (Gefahrenhinweise) und P-Sätzen (Sicherheitshinweise).</li>
        <li>Bis 2015 galten orange Gefahrensymbole mit Kennbuchstaben: E explosionsgefährlich, F+/F hoch/leicht entzündlich, O brandfördernd, T+/T sehr giftig/giftig, Xn gesundheitsschädlich, Xi reizend, C ätzend, N umweltgefährlich.</li>
        <li>Warnzeichen am Arbeitsplatz sind gelbe Dreiecke mit schwarzem Rand.</li>
      </ul></div></details>
      <details class="acc"><summary>Begrenzte und freigestellte Mengen, Papiere</summary><div class="in"><ul class="gul">
        <li><b>Begrenzte Mengen (LQ):</b> Versandstücke bis 30 kg brutto ohne Gefahrzettel, nur mit dem schwarz-weißen Rautenzeichen. Warntafeln am LKW erst ab bestimmten Mengen.</li>
        <li><b>Freigestellte Mengen (EQ):</b> Kennzeichen mit Gefahrzettel-Nummer, Paketinhalt höchstens 1 l bzw. 1 kg.</li>
        <li><b>Beförderungspapiere</b> enthalten mindestens UN-Nummer, Stoffbenennung, Klasse bzw. Gefahrzettel, ggf. Verpackungsgruppe, Anzahl der Versandstücke, Gesamtmenge, Absender, Empfänger und ggf. Tunnelbeschränkungscode.</li>
        <li><b>Eisenbahn:</b> ein umlaufender orangefarbener Streifen kennzeichnet Kesselwagen mit verflüssigten, tiefgekühlten oder gelösten Gasen.</li>
        <li><b>Binnenschifffahrt:</b> Gefahrgutschiffe zeigen bei Tag blaue Kegel, bei Nacht blaue Lichter.</li>
        <li><b>Rohrleitungen</b> (ÖNORM Z 1001, nicht bindend): Grundfarbe für den Inhalt, Zusatzfarbe für die Gefahr, Pfeil für die Fließrichtung.</li>
      </ul></div></details>
    </div>

    <div class="gp" data-gp="lagen" role="tabpanel">
      <details class="acc"><summary>Menschenrettung, Erste Hilfe</summary><div class="in">
        <ul class="gul">
          <li>Lebensfunktionen prüfen, Atemwege freimachen.</li>
          <li>Nicht ansprechbar, atmet: stabile Seitenlage, Hilfe rufen. Atmet nicht: Herz-Lungen-Wiederbelebung, Defibrillator holen lassen.</li>
          <li>Starke Blutung: Blutstillung. Immer: Schockbekämpfung, Lagerung, warm halten, beruhigen.</li>
        </ul>
        <div class="gwarn">Bei Verdacht auf Kontamination keine Mund-zu-Mund-Beatmung, Taschenmaske oder Beatmungsbeutel verwenden. Bei Kontamination mit brennbaren Stoffen vor der Deko keinen Sauerstoff geben und nicht defibrillieren!</div>
        <h3>Sofort-Deko</h3>
        <ul class="gul">
          <li>Schon bei Verdacht (Kontakt mit Flüssigkeit, durchgaste Kleidung), mit vorhandenem Gerät, nicht auf den Deko-Platz warten.</li>
          <li>Kleidung entfernen (aufschneiden), betroffene Stellen mehrere Minuten mit viel sauberem Wasser spülen (C-Sprühstrahl), nicht bürsten.</li>
          <li>Wasser nicht über saubere Körperteile laufen lassen. Person auf abgedeckte Trage, in Rettungsdecke einhüllen.</li>
          <li>Kleidung in geschlossenem Behälter sammeln, „KONTAMINIERTES MATERIAL“ beschriften.</li>
          <li>Ausnahmen: biologische Stoffe nur entkleiden. Mit Wasser heftig reagierende Stoffe (Klasse 4.3) zuerst trocken entfernen, hat die Reaktion schon begonnen, sofort mit viel Wasser spülen. Bei Kälte Unterkühlung beachten.</li>
        </ul>
        <h3>Lagerung</h3>
        <div class="tw"><table class="gt">
          <tr><td>Bewusstlos</td><td>Seitenlage</td></tr>
          <tr><td>Schockzeichen, Kollapsneigung</td><td>Rückenlage, Beine hoch</td></tr>
          <tr><td>Bauchverletzung</td><td>Beine angezogen</td></tr>
          <tr><td>Brustkorbverletzung, Atemnot</td><td>halbsitzend</td></tr>
          <tr><td>Arme, Beine verletzt</td><td>ruhigstellen</td></tr>
        </table></div>
        <h3>Übergabe an den Rettungsdienst</h3>
        <ul class="gul">
          <li>Kontamination ja oder vermutet, betroffene Körperstellen, Stoff und Menge, Sicherheitsdatenblatt oder Unfallmerkblatt mitgeben.</li>
          <li>Art und Dauer der Einwirkung, eingeatmet oder verschluckt, Symptome, getroffene Maßnahmen.</li>
          <li>Hinweis: Sofort-Deko ist keine vollständige Dekontamination. Rettungsfahrzeug lüften, Sanitätspersonal schützen.</li>
        </ul>
        <p class="ghint">Ein kontaminierter Verletzter ist von einer „sekundären Wirkzone“ umgeben. Eigenschutz!</p>
      </div></details>

      <details class="acc"><summary>Deko und Einsatzhygiene</summary><div class="in">
        <h3>Standard-Deko</h3>
        <ul class="gul">
          <li>Deko-Platz an der inneren Absperrgrenze, windzugekehrt, befestigter Untergrund, bei Platzmangel Korridor mit Trassenband.</li>
          <li>Ausstattung: Auffangwanne, Gerät zum Aufbringen des Dekomittels, Wasser zum Nachspülen (Sprühstrahl).</li>
          <li>Ablauf: Schutzausrüstung mit Dekomittel reinigen (Einwirkzeit), verschleppungsfrei ablegen, bei Verdacht auf Hautkontakt sofort Personen-Deko.</li>
          <li>Auch bei Einsätzen mit besonderer Gesundheitsgefahr, z. B. Kunststoffbränden.</li>
        </ul>
        <h3>Sofort-Deko bei vielen Zivilpersonen</h3>
        <ul class="gul">
          <li>Sammeln, beruhigen, Lage erklären, Kleidung ausziehen, Haut abspülen.</li>
          <li>Lebensbedrohlich: Übergabe an den Rettungsdienst. Sonst Personen-Deko vor Ort oder Transport zu geeigneter Einrichtung (Dusche, Hallenbad, Turnhalle).</li>
        </ul>
        <h3>Einsatzhygiene</h3>
        <ul class="gul">
          <li>Keine Esswaren, Rauchwaren, Handy, Geldbörse oder Schmuck in den Einsatz mitnehmen.</li>
          <li>Mit Wunden oder Hautkrankheiten keine Tätigkeiten mit Kontaminationsgefahr.</li>
          <li>Kontaminierte Ausrüstung dicht verpacken und kennzeichnen, Fahrzeuginnenraum sauber halten.</li>
          <li>Gesicht und Hände noch an der Einsatzstelle reinigen. Auch beim Aufräumen besteht Kontaminationsgefahr.</li>
          <li>Bis nach der Körperreinigung nicht essen, trinken oder rauchen. Verschmutzte Kleidung nicht privat waschen.</li>
        </ul>
      </div></details>

      <details class="acc"><summary>Strahleneinsatz</summary><div class="in">
        <ul class="gul">
          <li>GAMS gilt auch hier. Abstand mindestens 30 bis 60 m, Menschenrettung mit Brandschutzbekleidung und Atemschutz.</li>
          <li>Spezialkräfte: Strahlenschutzbeauftragte, Strahlenschutzstützpunkt, Polizei, Behörde.</li>
          <li><b>Offener</b> Stoff: Strahlung plus Kontamination und Inkorporation, Atemschutz und Deko erforderlich. <b>Umschlossener</b> Stoff: nur Strahlung.</li>
        </ul>
        <h3>Absperrgrenzen</h3>
        <div class="tw"><table class="gt">
          <tr><td>Kontamination (offener Stoff)</td><td class="n">3-facher Leerwert</td></tr>
          <tr><td>Nur unbedingt nötige Kräfte mit Dosimeter</td><td class="n">über 100 µSv/h</td></tr>
          <tr><td>Kräfte mit zusätzlicher Ausrüstung</td><td class="n">10 bis 100 µSv/h</td></tr>
          <tr><td>Übrige Einsatzkräfte</td><td class="n">unter 10 µSv/h</td></tr>
        </table></div>
        <h3>Einsatzdosis</h3>
        <div class="tw"><table class="gt">
          <tr><td class="n">10 µSv</td><td>Übung</td></tr>
          <tr><td class="n">20 mSv</td><td>Schutz von Sachwerten</td></tr>
          <tr><td class="n">100 mSv</td><td>nur zur Abwehr akuter Gefahr für Personen oder wesentlicher Schadensausweitung</td></tr>
          <tr><td class="n hi">250 mSv</td><td>nur zur Rettung von Menschenleben, einmal im Leben</td></tr>
        </table></div>
        <ul class="gul">
          <li>Nicht einsetzen: unter 18 Jahren, nach Erreichen der Lebensdosis, mit offenen Wunden oder Hauterkrankungen, in Schwangerschaft und Stillzeit.</li>
          <li>Personendosimeter für alle, Dosiswarner mindestens je Trupp. Aufenthaltszeit je Person aufschreiben, rasch ablösen.</li>
          <li>Verletzung im Bereich offener Stoffe: sofort ablösen, ärztlich auf Inkorporation untersuchen.</li>
        </ul>
        <h3>Abschätzen der Dosisleistung in 1 m</h3>
        <div class="calc"><label for="gTI">Transportkennzahl TI</label><input id="gTI" inputmode="decimal" placeholder="z. B. 2,5"><output id="gTIo" for="gTI">–</output></div>
        <p class="muted">TI × 10 = Dosisleistung in 1 m in µSv/h.</p>
        <div class="calc"><label for="gAkt">Aktivität offener Quelle</label><input id="gAkt" inputmode="decimal" placeholder="Wert"><select id="gAktU" class="calc-u" aria-label="Einheit"><option value="1">MBq</option><option value="1000">GBq</option><option value="1000000">TBq</option></select><output id="gAkto" for="gAkt gAktU">–</output></div>
        <p class="muted">Faustformel für den ungünstigsten Fall: MBq × 0,5 = µSv/h in 1 m.</p>
        <div class="tw"><table class="gt">
          <thead><tr><th>Kategorie</th><th>Oberfläche</th><th>in 1 m</th><th>TI</th></tr></thead>
          <tr><td>I-WEISS</td><td class="n">bis 5 µSv/h</td><td>–</td><td class="n">0</td></tr>
          <tr><td>II-GELB</td><td class="n">bis 0,5 mSv/h</td><td class="n">bis 10 µSv/h</td><td class="n">bis 1</td></tr>
          <tr><td>III-GELB</td><td class="n">bis 2 mSv/h</td><td class="n">bis 100 µSv/h</td><td class="n">bis 10</td></tr>
          <tr><td>III-GELB, ausschließliche Verwendung</td><td class="n">bis 10 mSv/h</td><td class="n">ab 100 µSv/h</td><td class="n">über 10</td></tr>
        </table></div>
      </div></details>

      <details class="acc"><summary>Biologische Agenzien</summary><div class="in">
        <div class="tw"><table class="gt">
          <thead><tr><th>Kennzeichnung</th><th>UN</th><th>Bedeutung</th></tr></thead>
          <tr><td>Kategorie A, 606</td><td class="n">2814</td><td>ansteckungsgefährlich für Menschen</td></tr>
          <tr><td>Kategorie A, 606</td><td class="n">2900</td><td>nur für Tiere ansteckungsgefährlich</td></tr>
          <tr><td>Kategorie B, 606</td><td class="n">3373</td><td>diagnostische oder klinische Proben</td></tr>
          <tr><td>Kategorie B, 606</td><td class="n">3291</td><td>klinischer oder medizinischer Abfall</td></tr>
          <tr><td>90</td><td class="n">3245</td><td>gentechnisch veränderte Organismen, nicht infektiös, Umweltgefahr möglich</td></tr>
        </table></div>
        <p class="muted">Proben können mit Trockeneis (CO₂) oder flüssigem Stickstoff gekühlt sein: Erstickungs- und Erfrierungsgefahr.</p>
        <ul class="gul">
          <li>Früh verständigen: Spezialkräfte für Schutz und Deko, Rettungsdienst, Amtsarzt. Notarzt und Laborverantwortliche bzw. Beauftragte für biologische Sicherheit an die Einsatzstelle holen.</li>
          <li>Nicht einsetzen mit offenen Wunden, Hautentzündung oder Krankheit. Im Gefahrenbereich so wenig Bewegung wie möglich („Stand still“).</li>
          <li>Großräumig absperren (Quarantänebereich), Polizei sperrt außen. Verlassen und Betreten nur nach Freigabe der Behörde. Deko-Platz sofort einrichten.</li>
          <li>Gerettete können Kontaminationsquelle sein. Betroffene trennen: bestätigter, möglicher, sicher kein Kontakt.</li>
          <li>Ausgetretenes nicht berühren, nicht durchgehen, abdecken und feucht halten, vor Wind und Regen schützen.</li>
          <li>Brand: kein Hochdruck und kein Strahl in den Stoff, kleine Brände mit Sand, Kalk, Soda oder Pulver, sonst passend zur Umgebung. In Bereichen RG3/RG4 vorrangig Schaum, kein Pulver, wenig Löschmittel, Zutritt nur mit Personal.</li>
          <li>Geräte nicht selbst reinigen, Entsorgung durch Fachpersonal. Danach ärztliche Nachsorge und Dokumentation aller Eingesetzten.</li>
        </ul>
        <p class="ghint">Körperschutz: mindestens FFP3 mit Augenschutz oder Vollmaske mit P3-Filter, flüssigkeitsdichte Schutzkleidung, Einweghandschuhe (Nitril), Stiefel. Haut an Hals, Händen und Beinen abdecken.</p>
        <div class="tw"><table class="gt">
          <thead><tr><th>Erreger</th><th>Risikogruppe</th><th>Kat.</th></tr></thead>
          <tr><td>Ebola, Lassa</td><td class="n">4</td><td>A</td></tr>
          <tr><td>Milzbrand</td><td class="n">3</td><td>A</td></tr>
          <tr><td>SARS, Hepatitis B und C, CJK/BSE, HIV</td><td class="n">3</td><td>B</td></tr>
          <tr><td>Maul- und Klauenseuche</td><td class="n">2</td><td>A</td></tr>
          <tr><td>Vogelgrippe, Hepatitis A, Cholera, E. coli, Meningitis, Salmonellen, Schweinepest, Staphylococcus aureus</td><td class="n">2</td><td>B</td></tr>
        </table></div>
        <p class="muted">Ab RG3 Schleusen und Unterdruck, Fenster nicht gewaltsam öffnen. Tierseuchen: Anordnungen des Amtstierarztes, keine Kräfte mit eigener Tierhaltung einsetzen.</p>
      </div></details>

      <details class="acc"><summary>Elektrizität, Photovoltaik</summary><div class="in">
        <div class="tw"><table class="gt">
          <thead><tr><th>Mindestabstand</th><th>bis 1 kV</th><th>über 1 kV bis 380 kV</th></tr></thead>
          <tr><td>Sprühstrahl, Pulver, Löschgase (Strahlrohr bis 12 mm, bis 200 l/min)</td><td class="n">1 m</td><td class="n">5 m</td></tr>
          <tr><td>Vollstrahl (Strahlrohr bis 12 mm, bis 200 l/min)</td><td class="n">5 m</td><td class="n">10 m</td></tr>
          <tr><td>Wasserwerfer Sprühstrahl</td><td>–</td><td class="n">10 m</td></tr>
          <tr><td>Wasserwerfer Vollstrahl</td><td>–</td><td class="n">35 m</td></tr>
          <tr><td>Tragbare Feuerlöscher</td><td class="n">1 m</td><td>–</td></tr>
          <tr><td>Annäherung mit Fahrzeugen und Geräten</td><td class="n">1 m</td><td class="n">3 m (bis 30 kV), 5 m (bis 380 kV)</td></tr>
          <tr><td>Herabhängende oder am Boden liegende Leitung</td><td class="n">1 m</td><td class="n hi">20 m (Schrittspannung)</td></tr>
        </table></div>
        <p class="muted">Gilt bei beliebiger Löschwasserqualität. Wurfweite von Hohlstrahlrohren bestmöglich nutzen. Über 1 kV: Schaumverbot. Jeden Einsatz rasch dem Netzbetreiber melden.</p>
        <ul class="gul">
          <li>Niederspannung: nur Holzmaste, Abstand 40 bis 60 m, 4 bis 5 Leiterseile, faustgroße Isolatoren, Hausanschlüsse.</li>
          <li>Hochspannung bis 30 kV: Holz-, Stahlgitter- oder Betonmaste, Abstand 50 bis 100 m, 3 oder 6 Seile, kopfgroße Isolatoren.</li>
          <li>30 bis 380 kV: Stahlgitter- oder Betonmaste, Abstand 200 bis 400 m, Isolatorketten, Blitzseil an der Mastspitze.</li>
        </ul>
        <h3>Photovoltaik</h3>
        <ul class="gul">
          <li>Bis 1000 V Gleichspannung, solange Licht einfällt, auch von Scheinwerfern. Immer von Spannung ausgehen.</li>
          <li>Mit Löschen und Retten unabhängig vom Schaltzustand beginnen, Abstände wie oben einhalten.</li>
          <li>Schaum nur bei absolut spannungsfreier Anlage. Module können sich lösen und abstürzen.</li>
          <li>Netzbetreiber oder Anlagenbetreiber verständigen. Inselanlagen speichern in Akkus.</li>
        </ul>
      </div></details>

      <details class="acc"><summary>Einsatz im Gleisbereich</summary><div class="in">
        <div class="gwarn">Gleis erst betreten, wenn das Anhalten aller Fahrten bestätigt ist. Bremsweg bis 2000 m!</div>
        <ul class="gul">
          <li>Gefahren: Züge bis 230 km/h, Oberleitung 15 kV (4,95 bis 6,00 m über Schiene), Umgehungs- und Verstärkungsleitungen bis 110 kV werden nicht automatisch mit abgeschaltet.</li>
          <li>Einsatzstelle über Kilometer und Hektometer auf Masten und Hektometersteinen beschreiben.</li>
          <li>Abschalten und Erdung über die Notfallleitstelle veranlassen. Eine Erdungsstange zeigt nur die Spannungsfreiheit der Oberleitung.</li>
          <li>Mindestabstand zur Oberleitung 3 m, zu herabhängenden Leitungen 20 m.</li>
          <li>Notfall ohne Bestätigung: Sicherungsposten in beiden Richtungen 2000 m entfernt, mit Funk und Gefahrsignal (kreisförmiges Schwingen von Fahne, Gegenstand oder Arm, nachts rote Lampe), seitlich mindestens 3 m zum Gleis.</li>
          <li>Nach bestätigter Abschaltung und Erdung bei unbeschädigter Oberleitung: Posten zur Überwachung der Erdung, dann auch Arbeiten im Bereich der geerdeten Oberleitung.</li>
          <li>Waggons gegen Entrollen sichern (Handbremse, Hemmschuh). Heizkupplung 1000 V, Steuerkabel 24 V, Luftleitungen 10 bzw. 5 bar.</li>
        </ul>

      <details class="acc"><summary>Fahrzeuge mit Alternativantrieb</summary><div class="in">
        <ul class="gul">
          <li>Brandbekämpfung aus der Distanz beginnen, Atemschutz auch im Freien, gegen Stäube mindestens FFP3.</li>
          <li>Gefahrenbereiche: Druckentlastung von Gasbehältern, Hochvoltbatterien (über 800 V möglich), Hochvoltkabel, Superkondensatoren, Airbags und Gurtstraffer, aktive Motorhaube, Stoßdämpfer, Leichtmetalle (Metallbrand).</li>
          <li>Möglich: Diesel, Benzin, Ethanol, Methanol, Flüssiggas, Erdgas (200 bar), Wasserstoff (900 bar oder tiefkalt). Hinweise des Herstellers (Rettungsdatenblatt) beachten.</li>
          <li>Kennzeichnung nach ISO 17840-4 (derzeit freiwillig, vor allem Busse und Nutzfahrzeuge): Symbole 15 × 20 cm an beiden Seiten, Front, Heck und Dach. Details: ÖBFV-Info E-20.</li>
          <li>Infektionsgefahr durch Blut: Einweghandschuhe.</li>
        </ul>
        <h3>Erdgastankstelle</h3>
        <ul class="gul">
          <li>Gas bis 300 bar verdichtet, Verdichter und Speicher in versperrtem Container. NOT-AUS hat Vorrang, bei öffentlichen Tankstellen immer im Kassenbereich.</li>
          <li>Zuleitung: Hochdruck bis etwa 80 bar, Mitteldruck 100 mbar bis 1 bar, Niederdruck bis 100 mbar.</li>
          <li>Gasnotruf: <a class="gtel" href="tel:128">128</a></li>
        </ul>
      </div></details>

      <details class="acc"><summary>Flugunfall Kleinflugzeug</summary><div class="in">
        <div class="gwarn">Ballistischer Rettungsfallschirm möglich: Gefahrenzone 100 m Radius, Sperrzone 30 m in Abschussrichtung. Zugang nur seitlich außerhalb der Abschussrichtung, Vorsicht vor Propeller und Turbine.</div>
        <div class="tw"><table class="gt">
          <tr><th>F</th><td>Feststellen der Gefahren</td></tr>
          <tr><th>L</th><td>Lage der Gefahren feststellen und sichern</td></tr>

          <tr><th>G</th><td>Gefahrenbereich und Raumordnung festlegen: Gefahrenzonen, Verletztensammelpunkt, Hubschrauberlandeplatz, Zufahrten, Bereitstellungsraum</td></tr>
          <tr><th>Z</th><td>Zugang festlegen</td></tr>

/* Adresse zu Koordinaten: zuerst Places (vom Demo Key unterstützt), sonst Geocoder */
async function findPos(addr){
 const errs=[];
 try{
  const {Place}=await google.maps.importLibrary("places");
  const {places}=await Place.searchByText({textQuery:addr,fields:["location"],region:"at",maxResultCount:1});
  if(places&&places[0]&&places[0].location){const l=places[0].location;return {lat:l.lat(),lng:l.lng()};}
  errs.push("Places: kein Treffer");
 }catch(e){console.warn("Places-Suche:",e);errs.push("Places: "+(e.message||e));}
 try{
  const {Geocoder}=await google.maps.importLibrary("geocoding");
  const r=await new Geocoder().geocode({address:addr,region:"at"});
  const l=r.results[0].geometry.location;return {lat:l.lat(),lng:l.lng()};
 }catch(e){console.warn("Geocoder:",e);errs.push("Geocoder: "+(e.code||e.message||e));}
 return {err:errs.join("; ")};
}

 <div class="ats-stat"><div class="ats-rest" id="atsR${i}"></div><div class="ats-st" id="atsS${i}"></div><div class="ats-sub" id="atsU${i}"></div><span class="ats-kb" id="atsK${i}" hidden>Druckkontrolle fällig</span></div>
 <div class="ats-btns">${run?`<button class="btn primary" data-ats="stop"${d}>Trupp zurück</button><button class="btn" data-ats="undo"${d}>Start zurücksetzen</button>`
  :`<button class="btn ats-go" data-ats="start"${d}>${t.tAus?"Neu anschließen":"Anschließen"}</button><button class="btn" data-ats="undo"${d}${t.tEin?"":" disabled"}>Zeiten löschen</button>`}</div>
 <label class="fld">Rufname<input${d} data-f="ruf" value="${escA(t.ruf)}"></label>
 <div class="fld">Atemschutzträger<div class="ats-pl">${pers}</div></div>
 ${t.pers.length<4?`<button class="btn ats-addp" data-ats="addp"${d}>+ Person</button>`:""}
 <div class="ats-chk"><label><input type="checkbox"${d} data-f="funk"${t.funk?" checked":""}>Funk</label>
  <input class="ats-in"${d} data-f="kanal" value="${escA(t.kanal)}" placeholder="Kanal / Funkrufname" aria-label="Funk Notiz">
  <label><input type="checkbox"${d} data-f="totmann"${t.totmann?" checked":""}>Totmannwarner aktiviert &amp; Schlüssel hinterlegt (falls vorhanden)</label></div>
 <label class="fld">Einsatzziel/-ort<textarea${d} data-f="ziel">${escA(t.ziel)}</textarea></label>
 <div class="ats-r2"><label class="fld">Zeit Ein<input type="time"${d} data-time="tEin" value="${hm(t.tEin)}"></label><label class="fld">Zeit Aus<input type="time"${d} data-time="tAus" value="${hm(t.tAus)}"></label></div>
</section>`;
}
function atsRender(){const g=$("#atsGrid");if(!g)return;g.innerHTML=ats.trupps.map(atsCard).join("");atsTick();}
function initAts(){
 const w=$("#atsWrap");
 if(alarm&&!ats.meta.adresse){ats.meta.adresse=alarm.street+", "+alarm.city;atsSave();}
 w.querySelectorAll("[data-m]").forEach(e=>e.value=ats.meta[e.dataset.m]||"");
 w.querySelectorAll("[data-s]").forEach(e=>e.value=ats.settings[e.dataset.s]);
 $("#atsCrew").innerHTML=crew.filter(c=>c[1].includes("ATS")).map(c=>`<option value="${escA(c[0])}">`).join("");
 w.oninput=e=>{const el=e.target;
  if(el.dataset.m)ats.meta[el.dataset.m]=el.value;
  else if(el.dataset.s)ats.settings[el.dataset.s]=Number(el.value);
  else if(el.dataset.f){const t=ats.trupps[+el.dataset.i],v=el.type==="checkbox"?el.checked:el.value;
   if(el.dataset.p!==undefined)t.pers[+el.dataset.p][el.dataset.f]=v;else t[el.dataset.f]=v;}
  else return;
  atsSave();atsTick();};
 w.onchange=e=>{const el=e.target,k=el.dataset.time;if(!k)return;const t=ats.trupps[+el.dataset.i];
  t[k]=hmTs(el.value,k==="tAus"?t.tEin:null);if(t.tAus&&t.tEin&&t.tAus<t.tEin)t.tAus+=864e5;atsSave();atsRender();};
 w.onclick=e=>{const b=e.target.closest("[data-ats]");if(!b)return;const a=b.dataset.ats,i=+b.dataset.i,t=ats.trupps[i];
  if(a==="add")ats.trupps.push(atsT());
  else if(a==="new"){if(!confirm("Alle Eingaben der Atemschutzüberwachung löschen und neu beginnen?"))return;ats=atsFresh(ats.settings);atsSave();initAts();return;}
  else if(a==="start"){t.tEin=Date.now();t.tAus=null;t.pers.forEach(p=>{p.pKontr="";p.pAus="";});}
  else if(a==="stop")t.tAus=Date.now();
  else if(a==="undo"){if(!confirm(`Zeiten von Trupp ${i+1} löschen?`))return;t.tEin=null;t.tAus=null;}
  else if(a==="del"){if(!confirm(`Trupp ${i+1} entfernen?`))return;ats.trupps.splice(i,1);}
  else if(a==="addp"){if(t.pers.length<4)t.pers.push(atsP());}
  else if(a==="delp"){const p=+b.dataset.p;if((t.pers[p].name||t.pers[p].pEin)&&!confirm(`Person ${p+1} entfernen?`))return;t.pers.splice(p,1);}
  atsSave();atsRender();};
 atsRender();
}
function atsTick(){
 const now=Date.now();let n=0;
 ats.trupps.forEach((t,i)=>{const c=atsCalc(t,now);if(c.warn)n++;
  if(view!=="atemschutz")return;const card=document.getElementById("atsC"+i);if(!card)return;
  card.querySelectorAll(`[data-fl="${i}"]`).forEach(f=>{f.style.transform="scaleY("+c.frac+")";f.style.fill=c.col;f.classList.toggle("bl",c.bl);f.closest("svg").classList.toggle("leer",!!c.leer);});
  $("#atsR"+i).textContent=c.rest;const st=$("#atsS"+i);st.textContent=c.st;st.style.color=c.warn?"var(--red)":"";
  $("#atsU"+i).textContent=c.sub;$("#atsK"+i).hidden=!c.kb;card.classList.toggle("warn",c.warn);});
 if(n!==atsAlarmN){atsAlarmN=n;renderSide();}
}
setInterval(atsTick,1000);

/* Verbindungsstatus */
function conn(){const on=navigator.onLine;$("#conn").classList.toggle("off",!on);$("#conn span").textContent=on?"Online":"Offline";}
addEventListener("online",conn);addEventListener("offline",conn);conn();

show(location.hash.slice(1)||"alarmierung");
</script>
</body>
</html>
